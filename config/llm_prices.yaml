# Model prices for est_cost_usd — CONFIG, NOT CODE (spec §7.0.9).
#
# Editing this file changes what llm_calls.est_cost_usd records and what the
# LLM_MONTHLY_BUDGET_USD guard adds up. No code change, no redeploy: the loader
# re-reads the file when its mtime changes (llm/client.py -> load_prices()).
#
# Source: https://platform.claude.com/docs/en/about-claude/pricing, read 2026-09-16.
# Units: US dollars per MILLION tokens (MTok). A call of 10k in / 2k out on
# claude-opus-5 therefore costs 10_000/1e6 * 5 + 2_000/1e6 * 25 = $0.10.
#
# These are LIST prices and an ESTIMATE. The invoice Anthropic issues is the
# authority; this table exists so the local spend guard can stop before a
# surprise, not so the repo can do accounting.
version: 1
source: https://platform.claude.com/docs/en/about-claude/pricing
retrieved: "2026-09-16"
currency: USD
unit: per_mtok

models:
  # Reasoning route (llm/client.py MODEL_REASONING). A Covered Model: 30-day
  # retention is REQUIRED for it and it is not ZDR-eligible — see the retention
  # note in llm/port.py before anyone writes "zero retention" on a DPIA.
  claude-fable-5-1:
    input: 10.0
    output: 50.0
    cache_read: null # not in the price table this file cites; null = billed at the input rate (conservative)

  # Drafting + fallback route (MODEL_DRAFTING / MODEL_FALLBACK).
  claude-opus-5:
    input: 5.0
    output: 25.0
    cache_read: null

  # Not routed to today; priced so a config change alone can switch a route.
  claude-sonnet-5:
    input: 2.0
    output: 10.0
    cache_read: null

  claude-haiku-4-5:
    input: 1.0
    output: 5.0
    cache_read: null

  # Local models cost nothing per token — that is the whole point of running the
  # OpenAI-compatible route against Ollama on a box in Nairobi. Listed at 0.0 so
  # est_cost_usd is 0.0 (a real number the budget can sum) and not NULL.
  "qwen3:4b": # quoted: the id contains a colon
    input: 0.0
    output: 0.0
    cache_read: 0.0

# Any model id absent from this table gets est_cost_usd = NULL (unknown), never a
# guessed price. NULL rows are excluded from the budget sum and reported as such.
