# Demo customer accounts for the support desk's action agent (docs/SUPPORT_DESK.md "Tools").
# Loaded and validated by src/noc_agents/support/accounts.py.
#
# FICTIONAL. The numbers sit in the synthetic +254 700 000 xxx / +254 110 000 xxx blocks, the
# names are invented, and every balance, transaction and bundle is made up. The tools READ this
# file and never write it: the effect of a refund or a reversal is recorded on the tool call
# (support_tool_calls.result_json), and the "already refunded / already reversed / re-credited
# in the last 30 days" checks read those rows back. Times are relative ("hours_ago",
# "days_ago") so the fixture never goes stale.
#
# M-PESA codes are 10 upper-case letters and digits, the shape customers copy from the
# confirmation SMS.

