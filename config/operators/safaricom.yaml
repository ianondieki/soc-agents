    hub_sites_hint: [SFC-MTK-HUB-THK, SFC-MTK-HUB-NYR]
    radio_oem: MIXED
    power_msp_primary: EGYPRO
    tx_msp_primary: SOLITON

  CST:
    label: "Coast"
    rnio: "RNIO-CST"
    fe_oncall: "FE-CST-01"
    description: >
      Coast region — Huawei radio sites. Radio → Huawei Radio.
      Humidity, salt, access issues common; fibre vendors Camusat/Ecta/Adrian.
    coverage_areas:
      - Mombasa Island / Tudor
      - Nyali / Bamburi / Shanzu
      - Changamwe / Port
      - Kilifi / Malindi / Kwale / Diani
    counties: [Mombasa, Kilifi, Kwale, Lamu, Taita-Taveta]
    hub_sites_hint: [SFC-CST-HUB-MSA, SFC-CST-HUB-NYL]
    radio_oem: HUAWEI
    power_msp_primary: ATC
    tx_msp_primary: CAMUSAT

  RFT:
    label: "Rift Valley"
    rnio: "RNIO-RFT"
    fe_oncall: "FE-RFT-01"
    description: >
      Rift Valley. Power at sites: Tetranet. Long-haul corridors Nakuru–Eldoret.
    coverage_areas:
      - Nakuru / Naivasha
      - Eldoret / Turbo
      - Kericho / Bomet
      - Kitale / Narok
