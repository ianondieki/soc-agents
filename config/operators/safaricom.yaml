    rnio: "RNIO-WNY"
    fe_oncall: "FE-WNY-01"
    description: >
      Western + Nyanza combined ops region. Power: Tetranet.
      Radio OEM mix: Nokia and Huawei sites.
    coverage_areas:
      - Kisumu lakeside metro
      - Kakamega / Bungoma / Busia
