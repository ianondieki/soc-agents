# ---------------------------------------------------------------------------
# Six geographical regions (~7000 sites network-wide)
# ---------------------------------------------------------------------------
regions:
  NBI_E:
    label: "Nairobi East"
    rnio: "RNIO-NBI-E"
    fe_oncall: "FE-NBI-E-01"
    description: >
      Nairobi East cluster. Power: Egypro / Remote Egypro. TX fibre: Egypro Fibre.
      Part of densest metro footprint serving large share of 50M+ subscribers.
    coverage_areas:
      - Eastlands (Umoja, Kayole, Pipeline, Donholm)
      - Embakasi / Airport corridor
      - Industrial Area east
      - Ruiru / Juja fringe east
    counties: [Nairobi, Kiambu, Machakos]
    hub_sites_hint: [SFC-NBIE-HUB-EMB, SFC-NBIE-HUB-EST]
    radio_oem: MIXED
    power_msp_primary: EGYPRO
    tx_msp_primary: EGYPRO_FIBRE

  NBI_W:
    label: "Nairobi West"
    rnio: "RNIO-NBI-W"
    fe_oncall: "FE-NBI-W-01"
    description: >
      Nairobi West — historically Huawei radio sites. Radio faults → Huawei Radio.
      Power/passive often ATC or Camusat on shared towers.
    coverage_areas:
      - Westlands / Parklands / Gigiri
      - CBD west / Upper Hill
      - Karen / Langata / Ngong Road
      - Kawangware / Kangemi
    counties: [Nairobi, Kajiado, Kiambu]
    hub_sites_hint: [SFC-NBIW-HUB-WLD, SFC-NBIW-HUB-KRN]
    radio_oem: HUAWEI
    power_msp_primary: ATC
    tx_msp_primary: CAMUSAT

  MTK:
    label: "Mt Kenya"
    rnio: "RNIO-MTK"
    fe_oncall: "FE-MTK-01"
    description: >
      Mt Kenya / Central highlands. Power: Egypro / Remote Egypro.
      TX: Soliton + Egypro Fibre primary.
    coverage_areas:
      - Thika / Murang'a
      - Nyeri / Karatina
      - Meru / Nanyuki
      - Embu / Kirinyaga
