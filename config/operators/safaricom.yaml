# =============================================================================
# SAFARICOM PLC — primary NOC profile (demo)
# Grounded in operator floor practice (~7,000 sites, 50M+ subscribers,
# six geographical regions). Neutral demo — not an official Safaricom system.
# =============================================================================
operator_id: safaricom
display_name: "Safaricom PLC (demo profile)"
# Ticket numbers: exactly 9 chars, system-generated, e.g. INC000042
incident_prefix: "INC"
problem_prefix: "PRB"
numbering_style: "inc9"   # INC + 6 digits
timezone: Africa/Nairobi
autonomy_level: L2_GUARDED
locale_notes: >
  ~7000 sites / 50M+ subscribers across six regions.
  Power MSP and fibre MSP differ by region; radio OEM is Huawei-only in
  Nairobi-West & Coast, mixed Nokia/Huawei in Western-Nyanza.

network_stats:
  approx_sites: 7000
  approx_subscribers: 50000000
  geographical_regions: 6

# ---------------------------------------------------------------------------
# Priority (subscriber impact) — as used on the floor:
#   P4: < 50,000
#   P3: < 100,000  (and ≥ 50,000)
#   P2: ≥ 100,000 and < 500,000
#   P1: ≥ 500,000
# ---------------------------------------------------------------------------
priority_thresholds:
  P4_max_users: 49999
  P3_max_users: 99999
  P2_max_users: 499999

site_type_priority_floor:
  HUB: P2
  CORE: P1
  BSC: P2
  RNC: P2
  TX: P3
  POWER: P3
  ENODEB: P4
  GNODEB: P4
  BTS: P4
  NODEB: P4
  OTHER: P4

p1_force_rules:
  multi_region: true
  site_types: [CORE]
  child_sites_down_gte: 20
  users_affected_gte: 500000

correlation:
  window_minutes: 15
  fingerprint_fields: [site_id, alarm_code, failure_domain]

# Expected resolution / SLA restore targets (minutes) by priority
sla_minutes:
  P1: { ack: 5, restore: 60, note_interval: 15 }
  P2: { ack: 10, restore: 120, note_interval: 30 }
  P3: { ack: 20, restore: 240, note_interval: 60 }
  P4: { ack: 30, restore: 480, note_interval: 120 }

region_sla_note_multiplier:
  NBI_E: 1.0
  NBI_W: 1.0
  MTK: 1.15
  CST: 1.25
  RFT: 1.15
  WNY: 1.2

# Legacy fallback pools (used only if region matrix missing)
assignment_matrix:
  power_passive: [EGYPRO, TETRANET, ATC]
  transmission_fiber: [EGYPRO_FIBRE, CAMUSAT, ECTA]
  transmission_mw: [EGYPRO_FIBRE, FIELD_ENGINEER]
  radio_active: [HUAWEI_RADIO, FIELD_ENGINEER]
  core: [NOC]
  environment: [TETRANET, ATC]
  unknown: [NOC]

# ---------------------------------------------------------------------------
# PRIMARY ROUTING — region × domain (Safaricom field reality)
#
# 1) MT-KENYA + NAIROBI EAST:
#      Power → Egypro / Remote Egypro
#      TX fibre → Egypro Fibre (Mt-Kenya also Soliton for TX)
# 2) NAIROBI-WEST + COAST:
#      Huawei sites only → radio failures → Huawei Radio
#      Power often ATC/Camusat where passive shared (ATC had some power sites)
# 3) RIFT:
#      Power → Tetranet
# 4) WESTERN-NYANZA:
#      Power → Tetranet; radio OEM mix Nokia + Huawei
#
# Fibre ecosystem (TX): Ecta, Camusat, Egypro Fibre, Soliton (Mt-Kenya),
#   Adrian Fibre, Alan Dick; power also ATC on some sites.
# ---------------------------------------------------------------------------
assignment_by_region:
  NBI_E:
    power: [EGYPRO, EGYPRO_REMOTE]
    tx_fiber: [EGYPRO_FIBRE, CAMUSAT, ECTA]
    tx_mw: [EGYPRO_FIBRE, FIELD_ENGINEER]
    radio: [FIELD_ENGINEER]
    radio_oem: MIXED
  MTK:
    power: [EGYPRO, EGYPRO_REMOTE]
    tx_fiber: [SOLITON, EGYPRO_FIBRE, CAMUSAT]
    tx_mw: [SOLITON, EGYPRO_FIBRE, FIELD_ENGINEER]
    radio: [FIELD_ENGINEER]
    radio_oem: MIXED
  NBI_W:
    power: [ATC, CAMUSAT, EGYPRO]
    tx_fiber: [CAMUSAT, ECTA, ADRIAN_FIBRE, ALAN_DICK, EGYPRO_FIBRE]
    tx_mw: [FIELD_ENGINEER, CAMUSAT]
    radio: [HUAWEI_RADIO, FIELD_ENGINEER]
    radio_oem: HUAWEI
  CST:
    power: [ATC, CAMUSAT, EGYPRO]
    tx_fiber: [CAMUSAT, ECTA, ADRIAN_FIBRE, ALAN_DICK, EGYPRO_FIBRE]
    tx_mw: [FIELD_ENGINEER, CAMUSAT]
    radio: [HUAWEI_RADIO, FIELD_ENGINEER]
    radio_oem: HUAWEI
  RFT:
    power: [TETRANET]
    tx_fiber: [CAMUSAT, ECTA, EGYPRO_FIBRE, ADRIAN_FIBRE]
    tx_mw: [TETRANET, FIELD_ENGINEER]
    radio: [FIELD_ENGINEER]
    radio_oem: MIXED
  WNY:
    power: [TETRANET]
    tx_fiber: [CAMUSAT, ECTA, EGYPRO_FIBRE, ADRIAN_FIBRE]
    tx_mw: [TETRANET, FIELD_ENGINEER]
    radio: [FIELD_ENGINEER, HUAWEI_RADIO]
    radio_oem: MIXED   # Nokia + Huawei sites

