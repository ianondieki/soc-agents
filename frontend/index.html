<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10201A" />
    <title>Kenya NOC Mission Control</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Display mode before the first paint (lib/display.ts): ?display=projector (or =standard)
         sets and stores it, so a TV opened on that link and its Wallboard keep it; otherwise the
         stored choice. Projector turns quiet mode on and =standard gives it back as it was before;
         quiet mode is applied here too, so nothing animates before the app has read it. -->
    <script>
      (function () {
        var d = document.documentElement, store = null, mode = null, quiet = null;
        try { store = window.localStorage; } catch (e) {}
        try {
          var q = new URLSearchParams(location.search).get("display");
          if (q === "projector" || q === "standard") mode = q;
        } catch (e) {}
        try {
          if (mode && store && mode !== store.getItem("noc_display_v1")) {
            if (mode === "projector") {
              store.setItem("noc_quiet_before_projector_v1", store.getItem("noc_quiet_mode_v1") === "1" ? "1" : "0");
              store.setItem("noc_quiet_mode_v1", "1");
            } else {
              // Leaving projector mode gives quiet mode back as it was, as the in-app toggle does.
              var before = store.getItem("noc_quiet_before_projector_v1");
              store.removeItem("noc_quiet_before_projector_v1");
              if (before === "0") store.setItem("noc_quiet_mode_v1", "0");
            }
            store.setItem("noc_display_v1", mode);
          }
          if (!mode && store) mode = store.getItem("noc_display_v1");
          if (store) quiet = store.getItem("noc_quiet_mode_v1");
        } catch (e) {}
        if (mode === "projector") d.setAttribute("data-display", "projector");
        // The theme follows the shift (lib/theme.ts; keep the two in step): a pinned "day" or
        // "night", else Day from 06:00 to 18:59 in Nairobi. Projector mode and the Wallboard are
        // always Night.
        var pref = null, theme = "night";
        try { if (store) pref = store.getItem("noc.theme"); } catch (e) {}
        if (pref === "day" || pref === "night") theme = pref;
        else {
          var h = -1;
          try { h = Number(new Intl.DateTimeFormat("en-GB", { hour: "numeric", hourCycle: "h23", timeZone: "Africa/Nairobi" }).format(new Date())); } catch (e) {}
          if (!(h >= 0)) h = (new Date().getUTCHours() + 3) % 24;
          theme = h >= 6 && h < 19 ? "day" : "night";
        }
        if (mode === "projector" || location.pathname.indexOf("/wallboard") === 0) theme = "night";
        d.setAttribute("data-theme", theme);
        try { document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "day" ? "#FBF9F5" : "#10201A"); } catch (e) {}
        if (quiet === "1" || (quiet === null && mode === "projector")) d.setAttribute("data-quiet", "on");
      })();
    </script>
    <!-- IBM Plex Sans (every weight and width, one variable file) and Fraunces (the titles and
         figures every page opens with): fetched with the stylesheet, not after it. Plex Mono and
         the Fraunces italic load when a page uses them. -->
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- route-chunk-preload -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
