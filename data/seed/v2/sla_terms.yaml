# =============================================================================
# Demo seed set v2 — sla_terms defaults  (spec §7.0.7; shape from §7.6.1)
# =============================================================================
# §7.6.1 says "`sla_terms` live in YAML, versioned, defaulting from
# `sla_minutes`". So this file is CONFIG, not table data. noc-seed-v2 therefore
# validates it and only writes rows if a Phase 4 `sla_terms` table turns out to
# exist; today it does not, and the loader says so.
#
# DERIVED: the whole `default` block is a byte-for-byte copy of
#   config/operators/safaricom.yaml -> sla_minutes   (lines 57-61)
# If those two ever disagree, safaricom.yaml wins and this file is stale.
#
# NOT DERIVED — needs Supply Chain / Legal (spec §7.6.5 lists exactly this as a
# human dependency, and §2 row "Contract SLA terms from Supply Chain"):
#   availability_target_pct, credit_shape, credit_pct, contract_ref
# The two vendor blocks below reproduce the ILLUSTRATIVE shapes named in the
# spec text itself (EGYPRO escalating_consecutive [15,30,50] — an AT&T CALNET
# -style shape; TETRANET per_occurrence [25]) and point at the two SYNTHETIC
# sample contracts in contracts/. They are NOT commercial terms. §7.6.6 already
# covers the honest fallback: with no contract behind them the scorecard card
# must read "defaults, not contract" and credits stay PROPOSED.
#
# NAMING NOTE for whoever builds Phase 4: §7.6.1's literal YAML block uses the
# keys `ack` / `restore` / `note_interval` (used here), while §7.6.1's
# vendor_scorecard_lines DDL comment shows a yaml_path of
# "sla_terms.vendors.EGYPRO.P1.ack_minutes". One of the two spellings has to
# give; this seed does not decide which. Flagged, not guessed.
# -----------------------------------------------------------------------------
sla_terms:
  version: "2026-09"
  source: "defaults copied from cfg.sla_minutes; no contract has been read"
  default:
    P1: {ack: 5, restore: 60, note_interval: 15}
    P2: {ack: 10, restore: 120, note_interval: 30}
    P3: {ack: 20, restore: 240, note_interval: 60}
    P4: {ack: 30, restore: 480, note_interval: 120}
    availability_target_pct: 99.5
    credit_shape: none
  vendors:
    EGYPRO:
      contract_ref: SAMPLE-MSA-EGYPRO-2026-01     # SYNTHETIC — contracts/egypro_msa_sample.md
      contract_is_synthetic: true
      credit_shape: escalating_consecutive
      credit_pct: [15, 30, 50]
      note: "illustrative shape named in spec §7.6.1; PROPOSED only, never billed"
    TETRANET:
      contract_ref: SAMPLE-SLA-TETRANET-2026-01   # SYNTHETIC — contracts/tetranet_sla_sample.md
      contract_is_synthetic: true
      credit_shape: per_occurrence
      credit_pct: [25]
      note: "illustrative shape named in spec §7.6.1; PROPOSED only, never billed"

# The two blocks below are the rest of the §7.6.1 defaults, carried here so the
# demo has one place to look. They are policy knobs, not contract terms.
scorecards:
  period: MONTH
  dispute_window_working_days: 10
  max_inferred_restore_pct: 10          # D9 data-quality gate
  bands:
    SLA_COMPLIANCE_PCT: {green: 95, amber: 90}
    NOTE_COMPLIANCE_PCT: {green: 90, amber: 80}
    AVAILABILITY_PCT: {green: 99.5, amber: 99.0}
  normalise_with: region_sla_note_multiplier   # cfg values 1.0/1.0/1.15/1.25/1.15/1.2

regulatory:
  deadlines_hours: {CA_OUTAGE_24H: 24, ODPC_BREACH_72H: 72, CII_24H: 24}
  significance:
    priorities: [P1]
    site_types: [CORE, HUB]
    users_affected_gte: 100000
    multi_region: true
  compliance_threshold_pct: 80
  # spec §7.6.1: the draft 2026 regs proposing 90 %/quarterly/county are
  # UNVERIFIED and not gazetted. 80 is the current figure; do not raise it here.
