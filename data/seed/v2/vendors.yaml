# =============================================================================
# Demo seed set v2 — vendors  (spec §7.0.7, target table §7.6.1 `vendors`)
# =============================================================================
# DERIVED, NOT INVENTED.
#   code         <- the key of each entry in cfg.msp_contacts
#   contacts     <- that entry verbatim (email / sms / domains)
#   display_name <- the spelling the same profile already uses in prose
#                   (safaricom.yaml "assignment_by_region" comment block:
#                    "Power: Egypro / Remote Egypro. TX fibre: Egypro Fibre.",
#                    "Fibre ecosystem (TX): Ecta, Camusat, Egypro Fibre,
#                     Soliton (Mt-Kenya), Adrian Fibre, Alan Dick")
#   sources:     config/operators/safaricom.yaml  lines 139-183  (11 codes)
#                config/operators/airtel.yaml     lines  63-72   (3 codes)
#
# NOT DERIVED — these need a human to confirm before anyone quotes them:
#   type           a first-pass classification into the §7.6.1 enum
#                  (MSP | FE_CONTRACTOR | OEM | TOWERCO). Every row carries
#                  `type_basis` saying what the guess rests on. REVIEW THESE.
#   contract_ref   only the two SYNTHETIC sample contracts in contracts/ are
#                  referenced. Every other vendor is deliberately null: this
#                  repo holds no real contract reference and must not pretend to.
#   active_from    a demo placeholder date, identical for every row, chosen only
#                  so the §7.6.1 UNIQUE (operator_id, code, active_from) has a
#                  value. It is NOT a commencement date.
#
# The e-mail addresses and MSISDNs below are the @example.com / +2547110000xx
# placeholders already in the operator profiles. They are not contact details.
# -----------------------------------------------------------------------------
seed_version: "v2-2026-09"
placeholder_active_from: &active_from "2026-01-01"   # demo placeholder, not a real date

