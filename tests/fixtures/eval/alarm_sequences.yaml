# =============================================================================
# Graded alarm sequences for the draft evals (spec §10.1 "Eval" row, §10.2 "Draft evals";
# CONFORMANCE C-21). Read by tests/eval/draft_eval.py; nothing else reads this file.
#
# WHAT A SEQUENCE IS. One eval task: a list of alarms replayed in order through
# graph.pipeline.process_event on a brand-new database, then the end state is graded, then
# every incident's executive brief is drafted through llm.assist.draft_exec_brief (the
# template with LLM_ENABLED unset, the model with it on) and the draft is graded.
#
# WHERE THE SHAPES COME FROM. Every alarm is copied from, or built in the exact shape of, an
# alarm this repository already sends: tests/integration/test_golden_sequence.py, the demo
# storm (src/noc_agents/scripts/demo_safaricom.py), the rain storm
# (src/noc_agents/services/scenarios.py RAIN_STORM_EVENTS), and the Safaricom profile's own
# site hints and regions (config/operators/safaricom.yaml). `source` names which. Keys are
# EventIngest fields (src/noc_agents/domain/schemas.py); the loader rejects any other key, so
# a typo cannot silently fall back to a default.
#
# WHERE THE EXPECTATIONS COME FROM. Every expected value is derived by hand from the rules
# below, and `why` shows the derivation. Nothing was copied from a run's output. If the
# pipeline disagrees with a `why`, one of the two is wrong: find out which before editing.
#
#   Priority (services/priority.evaluate_severity, config/operators/safaricom.yaml):
#     users -> P4 when <= 49,999; P3 when <= 99,999; P2 when <= 499,999; else P1
#     site-type floor, the more severe of the two wins: CORE P1; HUB, BSC, RNC P2;
#       TX, POWER P3; ENODEB, GNODEB, BTS, NODEB, OTHER P4
#     forced P1 (p1_force_rules): multi_region; site_type CORE; child_sites_down >= 20;
#       users_affected >= 500,000
#   Users when the alarm carries none (services/user_estimate.estimate_users):
#     CORE 2,500,000; HUB in NBI_E/NBI_W 450,000, other HUB 180,000; ENODEB in
#     NBI_E/NBI_W/CST 22,000, other ENODEB 8,000; GNODEB 15,000; BTS/NODEB 3,500; TX 50,000
#   HITL gate at L2_GUARDED (services/composition.needs_hitl): P1 and P2 wait for a human,
#     P3 and P4 auto-send. No Safaricom broadcast audience is external, so the envelope
#     adds nothing to that (services/alerts.build_alert governance).
#   Correlation (agents/correlate.py, correlation.window_minutes 15):
#     same site_id|alarm_code|failure_domain inside 15 minutes -> merged into the open
#       incident, no new ticket; child_sites_down becomes the larger of the two counts
#     parent_hub_id naming a HUB/CORE site with an open incident, on a site that is NOT
#       itself HUB/CORE -> linked as a cascade child: the parent's child_sites_down + 1,
#       no new ticket. The parent's priority is not re-evaluated (CONFORMANCE B-02).
#     otherwise -> a new incident
#   Numbering (services/numbering.py, numbering_style inc9): INC + 6 digits from one
#     counter, so a fresh database numbers INC000001, INC000002, ... in creation order.
#   Region label: regions.<code>.label -- NBI_E Nairobi East, NBI_W Nairobi West,
#     MTK Mt Kenya, CST Coast, RFT Rift Valley, WNY Western-Nyanza.
#   Next update (agents/ticket.py): next_update_at = ticket creation + 15 minutes
#     (`next_update_minutes` below).
#
# EXPECTED INCIDENTS are listed in incident-number order, which is creation order.
#
# SCOPE. Safaricom only. The Airtel profile numbers incidents ATL-YYYYMMDD-NNNNN, which
# cannot form the §6.1 envelope (IncidentRef pins ^INC\d{6}$; services/hitl.compose_alert
# says the same), so an Airtel draft cannot be judged by services/validators.validate_content.
#
# ADDING A SEQUENCE. Give it a unique id, name the source, write `why` for every expected
# incident from the rules above, then run
#     C:\Python313\python.exe -m pytest -q tests/eval
# The always-on test replays every sequence on the template path and must stay green.
# =============================================================================
schema_version: 1
operator: safaricom
autonomy_level: L2_GUARDED
next_update_minutes: 15

